<div class="screen correct-bg">
  <!-- Confetti particles -->
  <div class="confetti-layer" aria-hidden="true">
    @for (p of confetti(); track $index) {
      <span
        class="confetti-piece"
        [style.left.%]="p.x"
        [style.background]="p.color"
        [style.width.px]="p.size"
        [style.height.px]="p.size"
        [style.animation-delay.s]="p.delay"
        [style.animation-duration.s]="p.dur"
      ></span>
    }
  </div>

  <div class="result-card" [class.visible]="showContent()">
    <!-- Glow ring + check icon -->
    <div class="icon-ring">
      <div class="glow-ring"></div>
      <div class="icon-circle">
        <i class="pi pi-check-circle text-5xl! text-green-500"></i>
      </div>
    </div>

    <div class="stars-row" aria-label="3 stars">
      <span class="star" style="animation-delay: 0.1s">🥉</span>
      <span class="star big" style="animation-delay: 0.4s">🥇</span>
      <span class="star" style="animation-delay: 0.25s">🥈</span>
    </div>

    <h1 class="result-title">Quiz Complete!</h1>

    <p class="result-subtitle">{{ inspirationalMessage() }}</p>

    <div class="score-box">
      <app-avatar [player]="player()" [horizontal]="true"></app-avatar>
      <div class="flex items-center gap-2">
        <span class="score-value">{{ player()?.score }}</span>
        <span class="score-label text-xs! pt-2">pts</span>
      </div>
    </div>
  </div>
</div>
