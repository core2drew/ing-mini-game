<div class="bg-slate-800/60 backdrop-blur border border-slate-700 rounded-2xl p-8 shadow-2xl">
  <h2 class="text-xl font-semibold text-white mb-1">Jump In!</h2>
  <p class="text-slate-400 text-sm mb-6">Type the room ID and get your buzzer finger ready.</p>

  <form class="space-y-4">
    <div>
      <div class="card flex justify-center">
        <p-floatlabel variant="in" class="w-full">
          <input
            pInputText
            pInputMask="999-999-999"
            id="in_label"
            autocomplete="off"
            class="w-full bg-slate-900/60 border border-slate-600 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          />
          <label for="in_label">Room ID</label>
        </p-floatlabel>
      </div>
    </div>

    <!-- {error && (
          <p class="text-red-400 text-sm">{error}</p>
        )} -->

    <button
      type="button"
      class="w-full bg-blue-800 hover:bg-blue-700 disabled:bg-gray-700 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-all duration-200 shadow-lg shadow-blue-500/20 hover:shadow-blue-400/30 active:scale-95"
      (click)="joinRoom()"
    >
      Enter room
    </button>
  </form>
</div>
