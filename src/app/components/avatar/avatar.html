<div
  class="avatar-item"
  [ngClass]="{
    'flex-row! gap-4!': horizontal,
  }"
>
  <div
    class="avatar-bubble"
    [style.background]="hasEmoji ? null : avatarColor"
    [ngClass]="{
      'rainbow-background': hasEmoji,
    }"
  >
    {{ playerInitial }}
  </div>

  @if (showName()) {
    <span class="player-name">{{ player()?.name }}</span>
  }
</div>
