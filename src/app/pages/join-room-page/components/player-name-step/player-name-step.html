<div class="waiting-card">
  <app-logo-title></app-logo-title>
  <p class="text-slate-300 text-sm mb-6 text-center">
    Identify the Genius, put a name to the brain behind the answers.
  </p>

  <form #playerForm="ngForm" (ngSubmit)="enterGame(playerForm)" class="space-y-4">
    <div>
      <div class="card flex justify-center">
        <div class="w-full">
          <p-floatlabel variant="in" class="w-full">
            <input
              [(ngModel)]="playerName"
              [maxlength]="10"
              name="playerName"
              pInputText
              id="in_label"
              autocomplete="off"
              class="w-full bg-slate-900/60 border border-slate-600 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
              #playerNameRef="ngModel"
              required
            />
            <label for="in_label">Player name</label>
          </p-floatlabel>
          @if (playerNameRef.invalid && (playerNameRef.touched || playerForm.submitted)) {
            <p-message severity="error" size="small" variant="simple"
              >Player name is required.</p-message
            >
          }
        </div>
      </div>
    </div>

    <!-- {error && (
          <p class="text-red-400 text-sm">{error}</p>
        )} -->
    <p-button type="submit" class="join-button" [loading]="loading">Enter game</p-button>
  </form>
</div>
