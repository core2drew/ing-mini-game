<div class="waiting-card">
  <app-logo-title></app-logo-title>

  <!-- Animated heading -->
  <div class="heading-wrap">
    <h2 class="waiting-heading">Waiting for players</h2>
    <div class="typing-dots" aria-hidden="true">
      @for (d of dots; track d) {
        <span class="typing-dot" [style.animation-delay.ms]="d * 200"></span>
      }
    </div>
  </div>
  <p class="text-slate-300 text-sm mb-6 text-center">
    Sit back and relax while the lobby fills up.
  </p>

  <!-- Player avatars grid -->
  <div class="avatars-grid">
    @for (player of players$ | async; track player.name; let i = $index) {
      <div class="avatar-item">
        <div class="avatar-bubble" [style.background]="getAvatarColorByName(player.name)">
          {{ player.name.charAt(0).toUpperCase() }}
        </div>
        <span class="player-name">{{ player.name }}</span>
      </div>
    }
  </div>
</div>
