<main class="grid grid-cols-[1fr_340px] items-center max-w-300 m-auto gap-4">
  <div class="flex flex-col gap-4 my-5">
    <app-question-view
      class="w-full"
      [currentQuestion]="currentQuestion()"
      [questionTimer]="questionTimer()"
      (nextQuestion)="nextQuestion()"
    ></app-question-view>
    <app-player-list [players]="playersWithUIData()"></app-player-list>
  </div>
</main>
