<main class="grid grid-cols-[1fr_450px] my-5 max-w-300 m-auto gap-4">
  <div class="flex flex-col gap-4">
    <app-question-view
      class="w-full"
      [currentQuestion]="currentQuestion()"
      [questionTimer]="questionTimer()"
      (nextQuestion)="nextQuestion()"
    ></app-question-view>
    <app-player-list [players]="playersWithUIData()"></app-player-list>
  </div>
  <app-leaderboard [players]="leaderboardPlayers()"></app-leaderboard>
</main>
