<p-card>
  <ng-template #title>
    <div class="flex gap-2 justify-between">
      <div class="flex">
        <div>
          <p>Player status</p>
          <p class="text-xs text-slate-400">8 total players</p>
        </div>
      </div>
    </div>
  </ng-template>
  <p-divider />
  <div class="grid grid-cols-3 divide-x divide-zinc-700">
    <div class="flex flex-col items-center">
      <span class="text-2xl font-bold text-green-500">8</span>
      <span class="text-xs text-slate-400">Answered</span>
    </div>

    <div class="flex flex-col items-center">
      <span class="text-2xl font-bold text-amber-500">4</span>
      <span class="text-xs text-slate-400">Thinking</span>
    </div>

    <div class="flex flex-col items-center">
      <span class="text-2xl font-bold text-red-500">10</span>
      <span class="text-xs text-slate-400">Offline</span>
    </div>
  </div>
  <p-divider />

  <div class="grid grid-cols-1 gap-5">
    @for (player of playersAvatars(); track player.id) {
      <div [class]="'status-' + player.status">
        <div class="flex flex-col">
          <div class="mb-2">
            <app-avatar [player]="player" [showName]="false"></app-avatar>
            <span class="ml-2 text-sm font-medium">{{ player.name }}</span>
          </div>
          <div class="text-sm text-slate-400">
            <span class="pc-score">{{ player.score }} pts</span>
            <span class="pc-badge" [class]="'badge-' + player.status">
              {{ player.status }}
            </span>
          </div>
        </div>
        <div class="pc-status-dot" [class]="'dot-' + player.status"></div>
      </div>
    }
  </div>
</p-card>
