<div
  class="min-h-screen bg-gradient-to-br from-orange-300 via-orange-500 to-orange-700 flex items-center justify-center p-4"
>
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <div
        class="inline-flex items-center justify-center w-16 h-16 bg-orange-500 rounded-2xl mb-4 shadow-lg shadow-blue-500/30"
      >
        <svg lucideZap color="#fff"></svg>
      </div>
      <h1 class="text-4xl font-bold text-white tracking-tight">Quiz Blitz</h1>
      <!-- <p class="text-white mt-2 text-sm">Live trivia, real-time results</p> -->
    </div>

    <div class="bg-slate-800/60 backdrop-blur border border-slate-700 rounded-2xl p-8 shadow-2xl">
      <h2 class="text-xl font-semibold text-white mb-1">Join the game</h2>
      <p class="text-slate-400 text-sm mb-6">Enter your name to get started</p>

      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5"> Your name </label>
          <input
            type="text"
            placeholder="e.g. John"
            maxLength="{32}"
            class="w-full bg-slate-900/60 border border-slate-600 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            autoFocus
          />
        </div>

        <!-- {error && (
          <p class="text-red-400 text-sm">{error}</p>
        )} -->

        <button
          type="submit"
          class="w-full bg-blue-800 hover:bg-blue-700 disabled:bg-gray-700 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-all duration-200 shadow-lg shadow-blue-500/20 hover:shadow-blue-400/30 active:scale-95"
        >
          Join Game
        </button>
      </form>
    </div>

    <p class="text-center text-white text-xs mt-6">Your score will appear on the live dashboard</p>
  </div>
</div>
