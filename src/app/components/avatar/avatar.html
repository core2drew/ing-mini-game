<div class="avatar-item">
  <div
    class="avatar-bubble"
    [style.background]="hasEmoji ? null : player()?.avatarColor"
    [ngClass]="{
      'rainbow-background': hasEmoji,
    }"
  >
    {{ playerInitial }}
  </div>

  @if (showName()) {
    <span class="player-name">{{ player()?.name }}</span>
  }
</div>
