<div class="screen correct-bg">
  <!-- Confetti particles -->
  <div class="confetti-layer" aria-hidden="true">
    @for (p of confetti(); track $index) {
      <span
        class="confetti-piece"
        [style.left.%]="p.x"
        [style.background]="p.color"
        [style.width.px]="p.size"
        [style.height.px]="p.size"
        [style.animation-delay.s]="p.delay"
        [style.animation-duration.s]="p.dur"
      ></span>
    }
  </div>

  <div class="result-card" [class.visible]="showContent()">
    <!-- Glow ring + check icon -->
    <div class="icon-ring">
      <div class="glow-ring"></div>
      <div class="icon-circle">
        <svg class="check-svg" viewBox="0 0 52 52" fill="none">
          <circle cx="26" cy="26" r="25" stroke="#22c55e" stroke-width="2" fill="none" />
          <polyline
            class="check-path"
            points="14,27 22,35 38,17"
            stroke="#22c55e"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
      </div>
    </div>

    <div class="stars-row" aria-label="3 stars">
      <span class="star" style="animation-delay: 0.1s">★</span>
      <span class="star big" style="animation-delay: 0.25s">★</span>
      <span class="star" style="animation-delay: 0.4s">★</span>
    </div>

    <h1 class="result-title">Correct!</h1>
    <p class="result-subtitle">{{ inspirationalMessage() }}</p>
    <div class="score-box">
      <span class="score-label">Points earned</span>
      <span class="score-value">+{{ score }}</span>
    </div>

    <div class="action-row">
      <app-idle-text-dot
        text="And the journey continues... or does it? Let's find out"
      ></app-idle-text-dot>
    </div>
  </div>
</div>
