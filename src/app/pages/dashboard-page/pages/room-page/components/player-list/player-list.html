<p-card>
  <ng-template #title>
    <div class="flex gap-2 justify-between">
      <div class="flex">
        <div>
          <p>Player status</p>
          <p class="text-xs text-slate-400">{{ playersAvatars()?.length || 0 }} total players</p>
        </div>
      </div>
    </div>
  </ng-template>
  <p-divider />
  <div class="grid grid-cols-4 divide-x divide-zinc-700">
    <div class="flex flex-col items-center">
      <span class="text-2xl font-bold text-blue-500">10</span>
      <span class="text-xs text-slate-400">Waiting</span>
    </div>
    <div class="flex flex-col items-center">
      <span class="text-2xl font-bold text-green-500">8</span>
      <span class="text-xs text-slate-400">Answered</span>
    </div>

    <div class="flex flex-col items-center">
      <span class="text-2xl font-bold text-amber-500">4</span>
      <span class="text-xs text-slate-400">Thinking</span>
    </div>

    <div class="flex flex-col items-center">
      <span class="text-2xl font-bold text-red-500">10</span>
      <span class="text-xs text-slate-400">Offline</span>
    </div>
  </div>
  <p-divider />

  <div class="grid grid-cols-1 gap-2 max-h-125 overflow-y-auto">
    @for (player of playersAvatars(); track player.id) {
      <div
        class="flex flex-col gap-2 p-2 rounded-2xl player-status text-slate-800"
        [ngClass]="getStatusStyle(player?.status)"
      >
        <div class="flex items-center justify-between">
          <div>
            <app-avatar [player]="player" [showName]="false"></app-avatar>
            <span class="ml-2 text-sm font-medium">{{ player.name }}</span>
          </div>
          <p-chip class="p-0!">
            <span class="text-xs rounded-full px-2 py-1">
              {{ player.statusText || 'Unknown' }}
            </span>
          </p-chip>
        </div>
      </div>
    }
  </div>
</p-card>
