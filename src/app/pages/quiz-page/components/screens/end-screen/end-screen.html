<div class="end-screen">
  <div class="confetti-container" #confettiContainer></div>

  <div class="card">
    <div class="header">
      <h1>Quiz Complete!</h1>
      <p class="subtitle">Great effort! Here's how you did:</p>
    </div>

    <div class="score-section">
      <div class="score-circle">
        <svg viewBox="0 0 100 100" class="score-ring">
          <circle cx="50" cy="50" r="45" class="score-ring-bg" />
          <circle
            cx="50"
            cy="50"
            r="45"
            class="score-ring-progress"
            [style.stroke-dashoffset]="scoreOffset()"
          />
        </svg>
        <div class="score-value">
          <span class="score-number">{{ displayScore() }}</span>
          <span class="score-percent">%</span>
        </div>
      </div>

      <div class="performance-message" [class]="performanceClass()">
        {{ performanceMessage() }}
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card correct">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="stat-content">
          <span class="stat-value">{{ correctAnswers() }}</span>
          <span class="stat-label">Correct</span>
        </div>
      </div>

      <div class="stat-card incorrect">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </div>
        <div class="stat-content">
          <span class="stat-value">{{ incorrectAnswers() }}</span>
          <span class="stat-label">Incorrect</span>
        </div>
      </div>

      <div class="stat-card time">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <div class="stat-content">
          <span class="stat-value">{{ formatTime(timeTaken()) }}</span>
          <span class="stat-label">Time Taken</span>
        </div>
      </div>

      <div class="stat-card accuracy">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <div class="stat-content">
          <span class="stat-value">{{ questionsAnswered() }}</span>
          <span class="stat-label">Questions</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" (click)="restartQuiz()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Try Again
      </button>

      <button class="btn btn-secondary" (click)="shareResults()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        Share Results
      </button>

      <button class="btn btn-outline" (click)="reviewAnswers()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Review Answers
      </button>
    </div>
  </div>
</div>
