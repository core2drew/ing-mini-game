<button
  type="button"
  [ngClass]="buttonClass"
  [disabled]="disabled"
  class="relative flex items-center gap-3 p-4 rounded-xl font-medium transition-all duration-200 active:scale-95 disabled:active:scale-100 w-full"
>
  <span
    [ngClass]="colorConfig.bg"
    class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0"
  >
    {{ colorConfig.label }}
  </span>
  <span class="text-left text-sm leading-snug">{{ option }}</span>
  @if (isRevealed && isCorrect) {
    <i class="pi pi-check-circle ml-auto text-5xl"></i>
  }
  @if (isRevealed && isSelected && !isCorrect) {
    <svg class="w-4 h-4 ml-auto shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M10 14l-2-2m0 0l-2-2m2 2l2-2m-2 2l-2 2m0 0l2 2m-2-2l2 2"
      ></path>
    </svg>
  }
</button>
